[project]
name = "lab-management-system-fastapi"
version = "0.1.0"
description = "实验室管理系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # lab JWT 签发（LabJwtSigner 镜像，HS256）；版本钉版镜像 saas-identity-platform-fastapi
    "pyjwt==2.10.1",
    # ORM + PG 驱动：运行时依赖，必须随 Docker 镜像（镜像只装主依赖）。2026-10-02
    # saas 镜像仓 prod 首航事故镜像修复：sqlalchemy 此前只经 dev 组 sqlacodegen
    # 传递带入，容器 import app 即 ModuleNotFoundError；psycopg2 一并归位主依赖。
    "sqlalchemy>=2.1",
    "psycopg2-binary>=2.9",
    # SSO 客户端出站 HTTP（impl/saas_client.py）——运行时依赖。2026-10-02 本仓
    # v0.1.1 首航同族第二例：httpx 原在 dev 组（测试用），容器 import 即炸。
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # ruff/mypy 故意不在依赖里 —— suite 钉版全局工具链（gate.py RUFF_PINNED_VERSION），
    # 项目装新版会在 venv 遮蔽钉版触发 [RUFF-PIN] exit 2（2026-09-29 实测）
    "sqlacodegen==4.0.4",
    # sqlalchemy/psycopg2/httpx 已升主依赖（2026-10-02 两例首航事故），dev 组不重复声明
]

[tool.ruff]
line-length = 100
target-version = "py311"
# 生成区禁手改（gen-shared.sh / scaffold-entities.sh 产物），不进格式与 lint 门
extend-exclude = [
    "src/lab_management_system_fastapi/apis",
    "src/lab_management_system_fastapi/models",
    "src/lab_management_system_fastapi/security_api.py",
    "src/lab_management_system_fastapi/entities.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ARG", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
# 生成区不直接检查；被手写区 import 时经下方 overrides 以 Any 接入
exclude = [
    "^src/lab_management_system_fastapi/apis/",
    "^src/lab_management_system_fastapi/models/",
    "^src/lab_management_system_fastapi/security_api\\.py$",
    "^src/lab_management_system_fastapi/entities\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "lab_management_system_fastapi.apis.*",
    "lab_management_system_fastapi.models.*",
    "lab_management_system_fastapi.security_api",
    "lab_management_system_fastapi.entities",
]
# silent 而非 skip：skip 把生成模块类型降为 Any，impl 子类化 Base*Api 会报
# subclassing-Any（saas 仓同款教训——skip 丢模型真类型，silent 保类型只压告警）
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "lab_management_system_fastapi.impl.*"
# 生成 Base*Api 类体的 __init_subclass__ 钩子（pkgutil 缝发现机制）未标注，
# 缝类继承语句必然触发 no-untyped-call；继承之外的手写代码保持全 strict
disallow_untyped_calls = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
